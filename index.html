<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;500;600;700&family=El+Messiri:wght@500;600;700&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Playfair+Display:wght@600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@500;600;700;800&family=Inter:wght@500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --radius: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  :root{
    --font-heading: 'Tajawal', sans-serif;
    --font-body: 'Tajawal', sans-serif;
    --title-size: 1.55rem;
    --title-weight: 800;
    --title-lh: 1.35;
    --desc-lh: 1.8;
    --text-align: inherit;
  }
  body{
    font-family: var(--font-body);
    min-height:100vh;
    color: var(--ink);
    background: var(--bg-image, var(--bg));
    position:relative;
    transition: background .3s ease, color .3s ease;
  }
  body.lux-glow::before{
    content:"";
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(circle at 15% -10%, var(--accent) 0%, transparent 45%),
      radial-gradient(circle at 105% 105%, var(--secondary, var(--accent)) 0%, transparent 42%);
    opacity:.12;
  }
  /* ===== THEMES ===== */
  body[data-theme="1"]{ --bg:#F6F1E9; --ink:#211D17; --accent:#B5581F; --secondary:#D9A15E; --accent-ink:#ffffff; --card:#FFFFFF; --muted:#8A8072; --line:#E7DFCF; }
  body[data-theme="2"]{ --bg:#121417; --ink:#F2F2F0; --accent:#5B8CFF; --secondary:#8E6BFF; --accent-ink:#0A0A0A; --card:#1B1E22; --muted:#8E949C; --line:#2A2E33; }
  body[data-theme="3"]{ --bg:#FBEAE7; --ink:#2B1C24; --accent:#7A2F63; --secondary:#C97B8E; --accent-ink:#ffffff; --card:#FFFFFF; --muted:#9C7E8D; --line:#F1D3CD; }
  body[data-theme="4"]{ --bg:#F4E9D8; --ink:#1F2E27; --accent:#1F5C4A; --secondary:#B79A5C; --accent-ink:#ffffff; --card:#FFFCF6; --muted:#7C8A80; --line:#E3D3B4; }
  body[data-theme="5"]{ --bg:#FFFFFF; --ink:#15181B; --accent:#E4572E; --secondary:#E48A2E; --accent-ink:#ffffff; --card:#F7F7F8; --muted:#767C82; --line:#E9EAEC; }

  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none;}
  img{max-width:100%; display:block;}

  .wrap{max-width:520px; margin:0 auto; padding:0 18px 60px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; max-width:520px; margin:0 auto;
  }
  .brand{font-weight:800; font-size:1.15rem; letter-spacing:.2px; font-family:var(--font-heading);}
  .lang-switch{
    display:flex; background:var(--card); border:1px solid var(--line); border-radius:999px; overflow:hidden;
  }
  .lang-switch button{
    padding:7px 14px; font-size:.82rem; font-weight:700; background:transparent; color:var(--muted);
  }
  .lang-switch button.active{ background:var(--accent); color:var(--accent-ink); }

  .hero-media{
    border-radius: var(--radius); overflow:hidden; background:var(--card); border:1px solid var(--line); margin-bottom:22px;
  }
  .hero-media video, .hero-media img{ width:100%; display:block; }
  .video-wrap{ position:relative; width:100%; }
  .video-wrap .product-video{ width:100%; display:block; }
  .video-sound-btn{
    position:absolute; bottom:12px; left:12px; z-index:2;
    width:42px; height:42px; border-radius:50%;
    background:rgba(0,0,0,.58); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:1.05rem; backdrop-filter:blur(4px);
  }
  .thumbs{display:flex; gap:8px; margin-top:8px; overflow-x:auto;}
  .thumbs img{ width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--line); flex-shrink:0; }
  .product-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-12px 0 22px;}
  .product-gallery-item{position:relative;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer;aspect-ratio:1/1;}
  .product-gallery-item img{width:100%;height:100%;object-fit:cover;}
  .product-gallery-item:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .gallery-label{font-size:.82rem;font-weight:800;color:var(--muted);margin-bottom:7px;}
  .gallery-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px;}
  .gallery-dialog{position:relative;width:min(92vw,520px);display:flex;flex-direction:column;align-items:center;}
  .gallery-main{max-width:100%;max-height:78vh;border-radius:14px;object-fit:contain;background:#111;}
  .gallery-close,.gallery-nav{position:absolute;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.92);color:#111;font-size:1.3rem;font-weight:900;z-index:2;}
  .gallery-close{top:-8px;right:-8px;}
  .gallery-prev{left:-8px;top:50%;transform:translateY(-50%);}
  .gallery-next{right:-8px;top:50%;transform:translateY(-50%);}
  .gallery-counter{margin-top:10px;color:#fff;font-weight:800;font-size:.9rem;}
  @media(max-width:380px){.product-gallery{grid-template-columns:repeat(2,1fr);}}

  h1.title{ font-family:var(--font-heading); font-size:var(--title-size); font-weight:var(--title-weight); line-height:var(--title-lh); text-align:var(--text-align); letter-spacing:.1px; margin-bottom:10px; }
  .desc{ font-family:var(--font-body); color:var(--muted); font-size:.98rem; line-height:var(--desc-lh); text-align:var(--text-align); margin-bottom:18px; white-space:pre-line; }

  .price-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:22px; }
  .price{ font-family:var(--font-heading); font-size:1.7rem; font-weight:800; color:var(--accent); }
  .old-price{ font-size:1.05rem; color:var(--muted); text-decoration:line-through; }

  .cta{
    width:100%; padding:16px; border-radius:12px; background:var(--btn-color, var(--accent)); color:var(--accent-ink);
    font-family:var(--font-body); font-size:1.02rem; font-weight:800; margin-bottom:14px;
    transition: transform .12s ease, filter .12s ease;
  }
  .cta:active{ transform:scale(.97); filter:brightness(.94); }
  .cta.secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .wa-btn{ display:flex; align-items:center; justify-content:center; gap:8px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.86rem; font-weight:700; margin-bottom:6px; color:var(--muted); }
  .field input, .field textarea, .field select{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--bg); color:var(--ink); font-family:inherit; font-size:.95rem;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }

  .upsell-box{ border:1.5px dashed var(--accent); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
  .upsell-box .up-title{ font-weight:800; margin-bottom:6px; }
  .up-check{ display:flex; align-items:center; gap:10px; margin-top:10px; padding:12px; background:var(--bg); border-radius:10px; }

  .success{ text-align:center; padding:40px 10px; }
  .success .emoji{ font-size:3rem; margin-bottom:14px; }
  .success h2{ font-size:1.3rem; margin-bottom:8px; }
  .success p{ color:var(--muted); }

  .footer-note{ text-align:center; color:var(--muted); font-size:.78rem; margin-top:30px; }

  /* ===== ADMIN ===== */
  .admin-wrap{ max-width:640px; margin:0 auto; padding:20px 18px 80px; }
  .admin-login{ max-width:360px; margin:60px auto; }
  .admin-tabs{ display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:18px; padding-bottom:4px; scrollbar-width:thin; }
  .admin-tabs button{
    padding:9px 16px; border-radius:999px; background:var(--card); border:1px solid var(--line);
    font-size:.85rem; font-weight:700; color:var(--muted); white-space:nowrap; flex-shrink:0;
  }
  .admin-tabs button.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .section-title{ font-weight:800; font-size:1.1rem; margin-bottom:14px; }
  .theme-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:16px; }
  .theme-swatch{ height:46px; border-radius:10px; border:2px solid transparent; cursor:pointer; }
  .theme-swatch.selected{ border-color:var(--ink); }
  .save-btn{ padding:13px 22px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-weight:800; }
  .order-item{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .product-list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .product-list-row:last-child{border-bottom:0}
  .product-list-row.editing{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px;padding:10px}
  .plr-thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.2rem}
  .plr-thumb img{width:100%;height:100%;object-fit:cover}
  .plr-info{flex:1;min-width:0}
  .plr-title{font-weight:800;color:var(--ink);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plr-price{font-size:.78rem;color:var(--muted)}
  .plr-toggle{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);flex-shrink:0}
  .plr-toggle input{accent-color:var(--accent);width:16px;height:16px}
  .plr-edit{flex-shrink:0;padding:7px 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-weight:700;font-size:.78rem}
  .order-item .row1{ display:flex; justify-content:space-between; font-weight:700; margin-bottom:6px; }
  .order-item .meta{ color:var(--muted); font-size:.85rem; line-height:1.7; }
  .status-pill{ display:inline-block; padding:4px 12px; border-radius:999px; font-size:.78rem; font-weight:700; }
  .badge-new{ background:#FFF1D6; color:#8A5B00; }
  .badge-confirmed{ background:#DCF5E3; color:#1F7A3D; }
  .badge-cancelled{ background:#FBDCDC; color:#B02A2A; }
  .toggle{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .toggle input{ width:20px; height:20px; }
  .small-muted{ color:var(--muted); font-size:.8rem; margin-top:-6px; margin-bottom:14px; }
  .logout-btn{ font-size:.82rem; color:var(--muted); text-decoration:underline; }
  .msg{ padding:10px 14px; border-radius:10px; font-size:.85rem; margin-bottom:14px; }
  .msg.ok{ background:#DCF5E3; color:#1F7A3D; }
  .msg.err{ background:#FBDCDC; color:#B02A2A; }

  /* ===== NEW: quantity stepper ===== */
  .qty-stepper{ display:flex; align-items:center; justify-content:space-between; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; background:var(--bg); height:46px; }
  .qty-stepper button{
    background:var(--btn-color, var(--accent)); color:var(--accent-ink); font-size:1.3rem; font-weight:800;
    width:46px; height:100%; display:flex; align-items:center; justify-content:center;
    transition: transform .1s ease, filter .1s ease; flex-shrink:0;
  }
  .qty-stepper button:active{ transform:scale(.92); filter:brightness(.92); }
  .qty-stepper span{ flex:1; text-align:center; font-weight:800; font-size:1.05rem; font-family:var(--font-heading); color:var(--ink); }

  /* ===== NEW: admin nav links (preview / view site / logout) ===== */
  .admin-nav-links{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .admin-nav-links button, .admin-nav-links a{ font-size:.82rem; color:var(--muted); text-decoration:underline; background:none; padding:0; }

  /* ===== NEW: preview overlay ===== */
  /* Preview and public storefront use separate namespaces so their option styles cannot leak into each other. */
  .video-section{margin:18px 0}.section-mini-title{font-weight:900;margin-bottom:10px}.cart-bar{display:flex;justify-content:flex-end;margin:10px 0 14px}.cart-button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:999px;font-weight:800}.cart-button b{min-width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-size:.75rem}.purchase-selector{margin:20px 0}.purchase-selector .section-mini-title{font-size:1.12rem;color:var(--ink);margin-bottom:12px}.purchase-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.purchase-option{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:13px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)!important;font-weight:800;cursor:pointer;text-align:center}.purchase-option span{color:var(--ink)!important}.purchase-option.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent)}.purchase-option input{accent-color:var(--accent);width:18px;height:18px}.variety-choice-wrap{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.variety-choice-wrap .small-muted{color:var(--ink);font-weight:800;margin:0 0 10px}.variety-grid{grid-template-columns:1fr}.selection-info{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.selection-info-title{font-weight:900;color:var(--ink);font-size:1rem;margin-bottom:12px}
  .cart-button{cursor:pointer}
  .cart-summary{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;margin:-6px 0 14px;color:var(--card-ink)}
  .cart-summary-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .cart-summary-head strong{font-size:.95rem;color:var(--card-ink)}
  .cart-summary .small-muted{color:var(--card-muted)}
  .cart-close-btn{border:none;background:color-mix(in srgb,var(--card-ink) 8%,transparent);color:var(--card-muted);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:.9rem;line-height:1;flex-shrink:0}
  .cart-line{padding:10px 0;border-bottom:1px solid var(--line)}
  .cart-line:last-of-type{border-bottom:0}
  .cart-line-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cart-line-top strong{color:var(--card-ink)}
  .cart-remove-btn{border:none;background:color-mix(in srgb,var(--card-ink) 8%,transparent);color:var(--card-muted);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:.8rem;line-height:1;flex-shrink:0}
  .cart-remove-btn:active{transform:scale(.92)}
  .cart-line-qty{display:flex;align-items:center;gap:12px;margin-top:8px}
  .cart-qty-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:color-mix(in srgb,var(--card-ink) 6%,transparent);color:var(--card-ink);font-weight:800;cursor:pointer;font-size:1rem;line-height:1}
  .cart-qty-btn:active{transform:scale(.92)}
  .cart-line-qty span{font-weight:800;min-width:16px;text-align:center;color:var(--card-ink)}
  .cart-line-details{color:var(--card-muted);font-size:.86rem;margin-top:4px}
  .cart-line-total{margin-top:6px;font-weight:800;color:var(--card-ink)}
  .cart-total-row{margin-top:10px;padding-top:10px;border-top:1.5px solid var(--line);font-weight:900;color:var(--card-ink)}
.preview-storefront .purchase-option,
.preview-storefront .purchase-option span,
.preview-storefront .selection-info,
.preview-storefront .selection-info-title,
.preview-storefront .selection-info .field label,
.preview-storefront .card .field label,
.preview-storefront .cart-button,
.preview-storefront .pack-public,
.preview-storefront .pack-public-title{
  color:#2b2622 !important;
}
.preview-storefront .pack-public-desc{
  color:#6d645c !important;
}
.preview-storefront .purchase-selector .section-mini-title{
  color:#2b2622 !important;
}
.selection-info .field label{color:var(--ink);font-weight:800}.selection-info .choice-btn{color:var(--ink)}
.preview-storefront .choice-grid .choice-btn{display:inline-flex !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;position:relative;z-index:3;align-items:center;justify-content:center;}
.preview-overlay{ position:fixed; inset:0; background:var(--bg); z-index:2000; overflow-y:auto; }
  .preview-bar{ position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:12px 18px; background:var(--card); border-bottom:1px solid var(--line); }
  .preview-bar .tag{ font-size:.78rem; font-weight:800; color:var(--accent); }
  .preview-bar button{ padding:9px 16px; border-radius:999px; background:var(--ink); color:var(--bg); font-weight:700; font-size:.82rem; }

  /* ===== NEW: admin return floating button (on public site, admin only) ===== */
  .admin-return-btn{ position:fixed; bottom:16px; left:16px; z-index:999; padding:10px 16px; border-radius:999px;
    background:var(--ink); color:var(--bg); font-weight:700; font-size:.82rem; box-shadow:0 4px 14px rgba(0,0,0,.25); }

  /* ===== NEW: media uploads (images / video) ===== */
  .upload-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .upload-btn{ padding:10px 16px; border-radius:10px; background:var(--card); border:1.5px dashed var(--accent); color:var(--ink); font-weight:700; font-size:.85rem; }
  .img-thumb{ position:relative; width:70px; height:70px; border-radius:10px; overflow:hidden; border:1px solid var(--line); flex-shrink:0; }
  .img-thumb img{ width:100%; height:100%; object-fit:cover; }
  .img-thumb .rm-btn{ position:absolute; top:2px; left:2px; background:rgba(0,0,0,.6); color:#fff; border-radius:50%; width:20px; height:20px; font-size:.7rem; display:flex; align-items:center; justify-content:center; }
  .img-thumb .mv-btns{ position:absolute; bottom:2px; right:2px; display:flex; gap:2px; }
  .img-thumb .mv-btns button{ background:rgba(0,0,0,.6); color:#fff; border-radius:4px; width:16px; height:16px; font-size:.6rem; }
  .upload-status{ font-size:.8rem; color:var(--muted); margin-top:4px; min-height:1em; }
  .pack-admin-box{border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-top:22px;background:var(--card)}
  .pack-admin-title{font-size:1rem;font-weight:900;margin-bottom:6px}
  .pack-gallery-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .pack-public{margin:18px 0;padding:16px;border:1.5px solid var(--accent);border-radius:14px;background:var(--card)}
  .pack-public-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
  .pack-public-badge{font-size:.72rem;font-weight:800;color:var(--accent)}
  .pack-public-title{font-weight:900;font-size:1.05rem}
  .pack-public-desc{color:var(--muted);font-size:.86rem;line-height:1.7;margin:6px 0 10px}
  .choice-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.choice-btn{padding:8px 13px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-weight:700}.choice-btn.selected{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .pack-piece-choice{border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:9px;background:var(--bg)}

  .pack-gallery{position:relative;overflow:hidden;border-radius:12px;background:var(--bg);touch-action:pan-y}
  .pack-gallery img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
  .pack-gallery-btn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
  .pack-gallery-prev{left:10px}.pack-gallery-next{right:10px}
  .pack-gallery-dots{text-align:center;padding:7px 0 0;font-size:.72rem;color:var(--muted)}
  .pack-choice{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px}
  .pack-choice input{width:19px;height:19px}


  /* ===== NEW: auto-contrast demo swatch ===== */
  .contrast-demo{ padding:12px 14px; border-radius:10px; margin-top:8px; margin-bottom:14px; font-size:.85rem; font-weight:700; text-align:center; border:1px solid var(--line); }

  /* ===== NEW: Design / Typography tab ===== */
  .font-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }

function shadeColor(hex, percent){
  const h = (hex||"#888888").replace("#","");
  const full = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  let r = parseInt(full.substr(0,2),16); let g = parseInt(full.substr(2,2),16); let b = parseInt(full.substr(4,2),16);
  if(isNaN(r)||isNaN(g)||isNaN(b)){ r=g=b=136; }
  const t = percent<0 ? 0 : 255;
  const p = Math.abs(percent);
  r = Math.round((t-r)*p)+r; g = Math.round((t-g)*p)+g; b = Math.round((t-b)*p)+b;
  const toHex = v => v.toString(16).padStart(2,"0");
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}

/* ============ NEW: AUTO CONTRAST ============ */
function getReadableTextColor(hexBg){
  const hex = (hexBg||"#ffffff").replace("#","");
  const full = hex.length===3 ? hex.split("").map(c=>c+c).join("") : hex;
  const r = parseInt(full.substr(0,2),16); const rr = isNaN(r)?255:r;
  const g = parseInt(full.substr(2,2),16); const gg = isNaN(g)?255:g;
  const b = parseInt(full.substr(4,2),16); const bb = isNaN(b)?255:b;
  const toLin = c => { c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); };
  const L = 0.2126*toLin(rr)+0.7152*toLin(gg)+0.0722*toLin(bb);
  return L > 0.5 ? "#1A1A1A" : "#FAFAFA";
}
function getMutedColor(hexBg){
  return getReadableTextColor(hexBg) === "#1A1A1A" ? "#6B6B6B" : "#B7BBC0";

  document.body.style.setProperty("--muted", getMutedColor(bg));
  const cardBg = THEME_CARD_COLOR[themeId] || "#FFFFFF";
  document.body.style.setProperty("--card-ink", getReadableTextColor(cardBg));
  document.body.style.setProperty("--card-muted", getMutedColor(cardBg));

  /* custom luxury color overrides (fallback to theme defaults when empty) */
  if(settings.primary_color) document.body.style.setProperty("--accent", settings.primary_color);
  else document.body.style.removeProperty("--accent");
  if(settings.secondary_color) document.body.style.setProperty("--secondary", settings.secondary_color);
  else document.body.style.removeProperty("--secondary");
  if(settings.button_color) document.body.style.setProperty("--btn-color", settings.button_color);
  else document.body.style.removeProperty("--btn-color");
  if(settings.border_color) document.body.style.setProperty("--line", settings.border_color);
  else document.body.style.removeProperty("--line");

  /* luxury gradient background + soft glow */
  const useGradient = settings.bg_style !== "flat";
  if(useGradient){
    const light = shadeColor(bg, 0.06);
    const dark = shadeColor(bg, -0.05);
    document.body.style.setProperty("--bg-image", `linear-gradient(160deg, ${light} 0%, ${bg} 45%, ${dark} 100%)`);
    document.body.classList.add("lux-glow");
  } else {
    document.body.style.removeProperty("--bg-image");
    document.body.classList.remove("lux-glow");
  }

  /* typography */
  const style = FONT_STYLES[settings.font_style] || null;
  document.body.style.setProperty("--font-heading", style ? style.heading : "'Tajawal',sans-serif");
  document.body.style.setProperty("--font-body", style ? style.body : "'Tajawal',sans-serif");
  document.body.style.setProperty("--title-size", TITLE_SIZES[settings.title_size] || TITLE_SIZES.medium);
  document.body.style.setProperty("--title-weight", FONT_WEIGHTS[settings.font_weight] || FONT_WEIGHTS.bold);
  document.body.style.setProperty("--desc-lh", LINE_HEIGHTS[settings.line_height] || LINE_HEIGHTS.comfortable);
  document.body.style.setProperty("--title-lh", "1.3");
  document.body.style.setProperty("--text-align", TEXT_ALIGNS[settings.text_align] || TEXT_ALIGNS.auto);
}

function resetAdminChrome(){
  document.body.setAttribute("data-theme","5");
  document.body.classList.remove("lux-glow");
  ["--bg","--ink","--muted","--bg-image","--accent","--secondary","--btn-color","--line",
   "--font-heading","--font-body","--title-size","--title-weight","--title-lh","--desc-lh","--text-align"]
   .forEach(p=>document.body.style.removeProperty(p));
}

function initProductVideo(root=document){
  const video = root.querySelector(".product-video");
  const soundBtn = root.querySelector(".video-sound-btn");
  if(!video) return;

  video.muted = false;
  video.volume = 1;
  video.loop = true;
  video.autoplay = true;
  video.playsInline = true;

  const tryPlay = async ()=>{
    try{
      await video.play();
      if(soundBtn) soundBtn.textContent = video.muted ? "🔇" : "🔊";
    }catch(e){
      // Browsers may block autoplay with sound. Fall back to muted autoplay,
      // while keeping the custom sound button available.
      video.muted = true;
      try{ await video.play(); }catch(_){}
      if(soundBtn) soundBtn.textContent = "🔇";
    }
  };

  tryPlay();

  if(soundBtn){
    soundBtn.onclick = async ()=>{
      video.muted = !video.muted;
      if(!video.paused){
        try{ await video.play(); }catch(_){}
      } else {
        try{ await video.play(); }catch(_){}
      }
      soundBtn.textContent = video.muted ? "🔇" : "🔊";
    };
  }

  video.addEventListener("contextmenu", e=>e.preventDefault());
  video.setAttribute("controlsList","nodownload noplaybackrate");
  video.setAttribute("disablePictureInPicture","");
}

function translateAdminDom(root=document.getElementById("app")){
  if(!root) return;
  const dict=ADMIN_I18N[ADMIN_LANG]||ADMIN_I18N.ar;
  // Build reverse maps so switching Arabic <-> Français is always reversible.
  const otherLang = ADMIN_LANG === "fr" ? "ar" : "fr";
  const reverse = {};
  const otherDict = ADMIN_I18N[otherLang] || {};
  Object.keys(otherDict).forEach(k=>{
    const v = otherDict[k];
    if(v && v !== k && reverse[v] == null) reverse[v] = k;
  });

  // Translate only UI/static elements. Do not touch user-entered product/order content.
  const selectors = [
    "h1","h2","h3","h4","label","button","a","option",
    ".small-muted",".pack-admin-title",".pack-public-badge",
    ".msg",".admin-tabs button",".admin-nav-links button",
    ".admin-nav-links a"
  ].join(",");

  root.querySelectorAll(selectors).forEach(el=>{
    // Keep the admin-language selector's selected value functional.
    if(el.id === "admin-lang-select") return;
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    const nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n=>{
      const trimmed=n.nodeValue.trim();
      if(!trimmed) return;
      const translated = dict[trimmed] ?? reverse[trimmed];
      if(translated == null || translated === trimmed) return;
      n.nodeValue=n.nodeValue.replace(trimmed,translated);
    });
  });

  // Translate selected attributes when they are part of the admin UI.
  root.querySelectorAll("[aria-label]").forEach(el=>{
    const v=el.getAttribute("aria-label");
    if(dict[v]) el.setAttribute("aria-label",dict[v]);
  });
  root.querySelectorAll("[title]").forEach(el=>{
    const v=el.getAttribute("title");
    if(dict[v]) el.setAttribute("title",dict[v]);
  });
}

function watchAdminTranslations(){

}

/* Prevent overlapping boot calls when navigation/hash changes quickly. */
let BOOT_SEQ = 0;

/* ============ ROUTER ============ */
function parseHashParams(hash){
  const h = (hash||"").startsWith("#") ? hash.slice(1) : (hash||"");
  return new URLSearchParams(h);
}

async function boot(){
  const seq = ++BOOT_SEQ;
  const hp = parseHashParams(location.hash);
  if(hp.get("type")==="recovery" && hp.get("access_token")){
    renderResetPassword(hp.get("access_token"));
    return;
  }

  const hash = location.hash;
  try {
    if(hash.startsWith("#admin")){
      SHOW_ADMIN_RETURN = false;
      await initAdminSession(seq);
    } else if(hash === "#view"){
      SHOW_ADMIN_RETURN = true;
      STATE.step = "form";
      await loadPublicData();
      if(seq !== BOOT_SEQ || location.hash !== hash) return;
      renderLanding();
    } else {
      SHOW_ADMIN_RETURN = false;
      STATE.step = "form";
      await loadPublicData();
      if(seq !== BOOT_SEQ || location.hash !== hash) return;
      renderLanding();
    }
  } catch(e) {
    console.error("Boot failed:", e);
    if(seq === BOOT_SEQ && hash.startsWith("#admin")){
      renderAdminLogin();
    }
  }
}

async function initAdminSession(seq){
  const stored = loadStoredSession();
  if(!stored || !stored.access_token){
    if(seq === BOOT_SEQ) renderAdminLogin();
    return;
  }

  if(stored.expires_at && stored.expires_at - Date.now() >= 60000){
    session = stored;
    if(seq === BOOT_SEQ) await renderAdminDashboard("product");
    return;
  }

  try {
    const refreshed = await refreshSession(stored.refresh_token);
    if(seq !== BOOT_SEQ) return;
    if(refreshed && refreshed.access_token){
      saveSession({
        access_token: refreshed.access_token,
        refresh_token: refreshed.refresh_token || stored.refresh_token,
        expires_at: Date.now() + (refreshed.expires_in||3600)*1000,
        user: refreshed.user || stored.user
      });
      await renderAdminDashboard("product");
    } else {
      clearSession();
      renderAdminLogin();
    }
  } catch(e) {
    console.error("Admin session refresh failed:",e);
    clearSession();
    renderAdminLogin();
  }
}
window.addEventListener("hashchange", boot);
boot();

function colorToCss(value){
  const raw=String(value||'').trim();
  if(!raw) return '#d8d2cc';
  // Accept CSS colors directly (hex, rgb(), hsl(), named CSS colors, etc.).
  const test=document.createElement('span');
  test.style.color='';
  test.style.color=raw;
  if(test.style.color) return raw;
  const key=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const map={
    noir:'#111111',black:'#111111',اسود:'#111111',أسود:'#111111',
    blanc:'#ffffff',white:'#ffffff',ابيض:'#ffffff',أبيض:'#ffffff',
    beige:'#d8c2a6',beige:'#d8c2a6',بيج:'#d8c2a6',
    rouge:'#d32f2f',red:'#d32f2f',احمر:'#d32f2f',أحمر:'#d32f2f',
    bleu:'#2563eb',blue:'#2563eb',ازرق:'#2563eb',أزرق:'#2563eb',
    vert:'#2e7d32',green:'#2e7d32',اخضر:'#2e7d32',أخضر:'#2e7d32',
    jaune:'#f2c94c',yellow:'#f2c94c',اصفر:'#f2c94c',أصفر:'#f2c94c',
    rose:'#e91e63',pink:'#e91e63',وردي:'#e91e63',
    violet:'#7e57c2',purple:'#7e57c2',بنفسجي:'#7e57c2',
    orange:'#f57c00',برتقالي:'#f57c00',
    marron:'#795548',brown:'#795548',بني:'#795548',
    gris:'#9e9e9e',gray:'#9e9e9e',grey:'#9e9e9e',رمادي:'#9e9e9e',
    dore:'#d4af37',gold:'#d4af37',ذهبي:'#d4af37',
    argente:'#bfc3c7',silver:'#bfc3c7',فضي:'#bfc3c7'
  };
  if(map[key]) return map[key];
  for(const k of Object.keys(map)) if(key.includes(k)) return map[k];
  return '#d8d2cc';
}

  const isClothing=product.product_type==='clothing';

  const purchaseHtml=isClothing?buildPurchaseSection(product,lang,qty):`<div class="price-row"><span class="price">${product.price||0} ${t.currency}</span>${product.old_price?`<span class="old-price">${product.old_price} ${t.currency}</span>`:''}</div>${buildQtyStepper('product',lang,qty.product)}<button type="button" class="method-add-cart" data-purchase-add="product">🛒 ${lang==='ar'?'أضف إلى السلة':'Ajouter au panier'}</button>`;
  return `<div class="topbar"><div class="brand">${escHtml(settings.store_name||'')}</div><div class="lang-switch"><button type="button" data-lang="ar" class="${lang==='ar'?'active':''}">AR</button><button type="button" data-lang="fr" class="${lang==='fr'?'active':''}">FR</button></div></div><div class="wrap ${scopeClass}"><div class="hero-media">${mediaHtml}</div>${galleryHtml}<h1 class="title">${escHtml(title||'')}</h1><p class="desc">${escHtml(desc||'')}</p>${videoHtml}${purchaseHtml}<div class="cart-bar"><button type="button" class="cart-button" id="cart-button">🛒 <span>${lang==='ar'?'السلة':'Panier'}</span><b id="cart-count">0</b></button></div><div class="cart-summary" id="cart-summary" style="display:none"></div><div class="card"><div class="field"><label>${t.full_name}</label><input id="f_name" type="text"></div><div class="field"><label>${t.phone}</label><input id="f_phone" type="tel"></div><div class="field"><label>${t.city}</label><input id="f_city" type="text"></div><div class="field"><label>${t.address}</label><textarea id="f_address"></textarea></div><div id="order-msg"></div><button class="cta" id="submit-btn">${t.place_order}</button></div><div class="footer-note">${escHtml(settings.store_name||'')}</div>${buildStorefrontFooter(settings,lang)}</div>`;

function initCustomerGallery(root){
  if(!root)return;
  const images=Array.from(root.querySelectorAll('[data-gallery-open]')).map(el=>{
    const img=el.tagName==='IMG'?el:el.querySelector('img');
    return img?.src||'';
  }).filter(Boolean);
  if(!images.length)return;
  let overlay=root.querySelector('.gallery-overlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.className='gallery-overlay';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','معرض الصور');
    overlay.innerHTML=`<div class="gallery-dialog"><button type="button" class="gallery-close" aria-label="إغلاق">×</button><button type="button" class="gallery-nav gallery-prev" aria-label="الصورة السابقة">‹</button><img class="gallery-main" alt=""><button type="button" class="gallery-nav gallery-next" aria-label="الصورة التالية">›</button><div class="gallery-counter"></div></div>`;
    // `root` can be the Document itself (customer storefront) or an element (admin preview
    // overlay). Document.appendChild throws (only <html> may be a child of #document), which
    // silently aborted this whole function before wiring the click handlers below - that's why
    // the gallery never opened. Always attach the lightbox to document.body instead.
    (root.body || root).appendChild(overlay);
  }
  const main=overlay.querySelector('.gallery-main'),counter=overlay.querySelector('.gallery-counter');
  let index=0;
  const render=()=>{index=(index+images.length)%images.length;main.src=images[index];counter.textContent=`${index+1} / ${images.length}`;};
  const open=(i)=>{index=Number(i)||0;render();overlay.style.display='flex';};
  const close=()=>{overlay.style.display='none';};
  root.querySelectorAll('[data-gallery-open]').forEach(el=>el.onclick=()=>open(el.dataset.galleryOpen));
  overlay.querySelector('.gallery-close').onclick=close;
  overlay.querySelector('.gallery-prev').onclick=()=>{index--;render();};
  overlay.querySelector('.gallery-next').onclick=()=>{index++;render();};
  overlay.onclick=e=>{if(e.target===overlay)close();};
  root.addEventListener('keydown',e=>{if(overlay.style.display!=='flex')return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')index--,render();if(e.key==='ArrowRight')index++,render();});
  // Swipe support so customers can flip between photos with a finger drag, not just the arrows.
  let touchStartX=null;
  main.ontouchstart=e=>{touchStartX=e.changedTouches[0].clientX;};
  main.ontouchend=e=>{
    if(touchStartX===null)return;
    const dx=e.changedTouches[0].clientX-touchStartX;
    touchStartX=null;
    if(Math.abs(dx)<40)return;
    if(dx<0) index++; else index--;
    render();
  };
  overlay.style.display='none';
}

function initPurchaseSelector(root){
  if(!root)return;
  const singleWrap=root.querySelector('#single-wrap'),
        stdWrap=root.querySelector('#pack-standard-wrap'),
        cusWrap=root.querySelector('#pack-custom-wrap');
  const panels={product:singleWrap,pack_standard:stdWrap,pack_custom:cusWrap};
  const radios=root.querySelectorAll('input[name="purchase-choice"]');

  const showOnly=(key)=>{
    Object.entries(panels).forEach(([k,el])=>{
      if(el) el.style.display=(k===key)?'block':'none';
    });
  };

  const update=()=>{
    const selected=root.querySelector('input[name="purchase-choice"]:checked')?.value||Object.keys(panels).find(k=>panels[k])||'product';
    root.querySelectorAll('#purchase-selector .purchase-option').forEach(x=>{
      x.classList.toggle('selected',x.querySelector('input')?.checked);
    });
    showOnly(selected);
    if(!(root.closest && root.closest('#preview-overlay'))) STATE.purchaseType=selected;
  };

  radios.forEach(r=>r.addEventListener('change',()=>{
    update();
    // Any change of purchase method requires a fresh Add to cart.
    if(!(root.closest && root.closest('#preview-overlay'))) STATE.cartItem=null;
  }));
  update();

  // One delegated click handler for every size/color choice-btn in this root.
  root.querySelectorAll('.choice-grid').forEach(g=>{
    g.querySelectorAll('.choice-btn').forEach(b=>{
      b.onclick=(e)=>{
        e.preventDefault();
        g.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
        if(!(root.closest && root.closest('#preview-overlay'))) STATE.cartItem=null;
      };
    });
  });
}
function initSingleQuantity(root){
  if(!root)return;
  const setValue=(type,val)=>{
    val=Math.max(1,parseInt(val||'1',10));
    LANDING_QTY[type]=val;
    if(!(root.closest && root.closest('#preview-overlay'))) STATE.cartItem=null;
    const el=root.querySelector(`.qty-value[data-type="${type}"]`);
    if(el)el.textContent=val;
  };
  root.querySelectorAll('.qty-minus').forEach(btn=>{
    const type=btn.dataset.type;
    btn.onclick=(e)=>{e.preventDefault();setValue(type,(LANDING_QTY[type]||1)-1);};
  });
  root.querySelectorAll('.qty-plus').forEach(btn=>{
    const type=btn.dataset.type;
    btn.onclick=(e)=>{e.preventDefault();setValue(type,(LANDING_QTY[type]||1)+1);};
  });
  root.querySelectorAll('.qty-value').forEach(el=>{
    const type=el.dataset.type;
    el.textContent=LANDING_QTY[type]||1;

}
function getCurrentCartItem(root=document){
  const currentProduct = root?.__previewProduct || STATE.product;
  let purchase=root.querySelector('input[name="purchase-choice"]:checked')?.value;
  if(!purchase){
    if(root.querySelector('#single-wrap')) purchase='product';
    else if(root.querySelector('#pack-standard-wrap')) purchase='pack_standard';
    else if(root.querySelector('#pack-custom-wrap')) purchase='pack_custom';
    else purchase='product';
  }
  const qty=LANDING_QTY[purchase]||1;
  const productOptions={
    size:purchase==='product'?selectedChoice(root,'product-sizes'):'',
    color:purchase==='product'?selectedChoice(root,'product-colors'):''
  };
  let packOptions=[],unitPrice=0;
  if(purchase==='product'){
    unitPrice=currentProduct?.price||0;
  } else if(purchase==='pack_custom'){
    const c=getCustomPackConfig(currentProduct),n=Math.max(1,Number(c.pieces)||1);
    unitPrice=c.price||0;
    const commonSize=root.querySelector('#pack-custom-common-size .selected')?.dataset.value||'';
    for(let i=0;i<n;i++){
      const cg=root.querySelector(`.pack-colors[data-piece="${i}"] .selected`);
      packOptions.push({piece:i+1,size:commonSize,color:cg?.dataset.value||''});
    }
  } else if(purchase==='pack_standard'){
    const c=getStandardPackConfig(currentProduct);
    unitPrice=c.price||0;
    const commonSize=root.querySelector('#pack-standard-common-size .selected')?.dataset.value||'';
    packOptions=(c.colors||[]).map((color,i)=>({piece:i+1,size:commonSize,color:color||''}));
  }
  return {purchaseType:purchase,quantity:qty,productOptions,packOptions,unitPrice};
}

function purchaseLabel(purchase,lang){
  if(purchase==='pack_standard') return 'Pack Standard';
  if(purchase==='pack_custom') return lang==='ar'?'تشكيلة متنوعة':'Assortiment varié';
  return lang==='ar'?'قطعة واحدة':'Une pièce';
}
function syncCartItem(){ STATE.cartItem = STATE.cartItems.length ? STATE.cartItems[STATE.cartItems.length-1] : null; }
function addCartItem(item){ const copy=JSON.parse(JSON.stringify(item)); STATE.cartItems.push(copy); syncCartItem(); return copy; }
function cartTotal(){ return STATE.cartItems.reduce((sum,item)=>sum + Number(item.unitPrice||0)*Math.max(1,Number(item.quantity||1)),0); }
function cartQuantity(){ return STATE.cartItems.reduce((sum,item)=>sum + Math.max(1,Number(item.quantity||1)),0); }
function renderFullCartSummaryHtml(items,lang){
  const t=T[lang]||T.ar;
  const head=`<div class="cart-summary-head"><strong>${lang==='ar'?'محتوى السلة':'Contenu du panier'}</strong><button type="button" class="cart-close-btn" data-cart-close aria-label="${lang==='ar'?'إغلاق':'Fermer'}">✕</button></div>`;
  if(!items.length) return head+`<div class="small-muted">${lang==='ar'?'السلة فارغة':'Votre panier est vide'}</div>`;
  let html=items.map((item,i)=>{
    const label=purchaseLabel(item.purchaseType,lang);
    const qty=Math.max(1,Number(item.quantity||1));
    const total=Number(item.unitPrice||0)*qty;
    let details='';
    if(item.purchaseType==='product'){
      if(item.productOptions?.size) details+=`<div>${lang==='ar'?'المقاس':'Taille'}: ${escHtml(item.productOptions.size)}</div>`;
      if(item.productOptions?.color) details+=`<div>${lang==='ar'?'اللون':'Couleur'}: ${escHtml(item.productOptions.color)}</div>`;
    }else{
      const size=item.packOptions?.[0]?.size;
      if(size) details+=`<div>${lang==='ar'?'المقاس':'Taille'}: ${escHtml(size)}</div>`;
      (item.packOptions||[]).forEach((po,j)=>{ if(po.color) details+=`<div>${lang==='ar'?'القطعة':'Pièce'} ${j+1}: ${escHtml(po.color)}</div>`; });
    }
    const qtyControls = item.purchaseType==='product'
      ? `<div class="cart-line-qty"><button type="button" class="cart-qty-btn" data-cart-dec="${i}" aria-label="-">−</button><span>${qty}</span><button type="button" class="cart-qty-btn" data-cart-inc="${i}" aria-label="+">+</button></div>`
      : '';
    return `<div class="cart-line" data-cart-index="${i}"><div class="cart-line-top"><strong>${i+1}. ${escHtml(label)}</strong><button type="button" class="cart-remove-btn" data-cart-remove="${i}" aria-label="${lang==='ar'?'حذف':'Supprimer'}">✕</button></div>${details?`<div class="cart-line-details">${details}</div>`:''}${qtyControls}<div class="cart-line-total">${total} ${t.currency}</div></div>`;
  }).join('');
  html+=`<div class="cart-total-row">${lang==='ar'?'المجموع':'Total'}: ${cartTotal()} ${t.currency}</div>`;
  return head+html;
}
function renderCartSummaryHtml(item,lang){
  const t=T[lang]||T.ar;
  const total=(item.unitPrice||0)*(item.quantity||1);
  let rows=`<div><strong>${escHtml(purchaseLabel(item.purchaseType,lang))}</strong> — ${item.unitPrice||0} ${t.currency}</div>`;
  if(item.purchaseType==='product'){
    if(item.productOptions?.size) rows+=`<div>${lang==='ar'?'المقاس':'Taille'}: ${escHtml(item.productOptions.size)}</div>`;
    if(item.productOptions?.color) rows+=`<div>${lang==='ar'?'اللون':'Couleur'}: ${escHtml(item.productOptions.color)}</div>`;
  } else {
    const commonSize=item.packOptions?.[0]?.size;
    if(commonSize) rows+=`<div>${lang==='ar'?'المقاس':'Taille'}: ${escHtml(commonSize)}</div>`;
    (item.packOptions||[]).forEach((po,i)=>{rows+=`<div>${lang==='ar'?'القطعة':'Pièce'} ${i+1}: ${escHtml(po.color||'-')}</div>`;});
  }
  if((item.quantity||1)>1) rows+=`<div>${lang==='ar'?'الكمية':'Quantité'}: ${item.quantity}</div>`;
  rows+=`<div style="margin-top:6px"><strong>${lang==='ar'?'المجموع':'Total'}: ${total} ${t.currency}</strong></div>`;
  return rows;
}
function initCart(root){
  const currentProduct = root?.__previewProduct || STATE.product;
  const basket=root.querySelector('#cart-button');
  const addItem=(purchaseOverride)=>{
    const item=getCurrentCartItem(root);
    const lang = (root.closest && root.closest('#preview-overlay')) ? PREVIEW_LANG : STATE.lang;
    const err=(ar,fr)=>{ const msg=root.querySelector('#order-msg'); if(msg) msg.innerHTML=`<div class="msg err">${lang==='ar'?ar:fr}</div>`; };
    if(item.purchaseType==='product' && currentProduct?.product_type==='clothing'){
      const sizes=csvList(currentProduct.sizes||'');
      const colors=csvList(currentProduct.colors||'');
      if(sizes.length && !item.productOptions.size){ err('اختار المقاس من فضلك','Veuillez choisir la taille'); return; }
      if(colors.length && !item.productOptions.color){ err('اختار اللون من فضلك','Veuillez choisir la couleur'); return; }
    }
    if(item.purchaseType==='pack_standard'){
      const sizes=csvList(currentProduct?.sizes||'');
      if(sizes.length && !(item.packOptions?.[0]?.size)){ err('اختار المقاس من فضلك','Veuillez choisir la taille'); return; }
    }
    if(item.purchaseType==='pack_custom'){
      const sizes=csvList(currentProduct?.sizes||'');
      if(sizes.length && !(item.packOptions?.[0]?.size)){ err('اختار المقاس من فضلك','Veuillez choisir la taille'); return; }
      if((item.packOptions||[]).some(x=>!x.color)){ err('اختار لون كل قطعة من فضلك','Veuillez choisir la couleur de chaque pièce'); return; }
    }
    if(purchaseOverride && item.purchaseType!==purchaseOverride){
      const radio=root.querySelector(`input[name="purchase-choice"][value="${purchaseOverride}"]`);
      if(radio){radio.checked=true; radio.dispatchEvent(new Event('change',{bubbles:true}));}
      item.purchaseType=purchaseOverride;
    }
    // Packs are always quantity 1; only the single-piece method has +/- quantity.
    if(item.purchaseType!=='product') item.quantity=1;
    addCartItem(item);
    const count=root.querySelector('#cart-count'); if(count) count.textContent=String(cartQuantity());
    const summary=root.querySelector('#cart-summary');
    if(summary){summary.innerHTML=renderFullCartSummaryHtml(STATE.cartItems,lang);summary.style.display='block';}
    const msg=root.querySelector('#order-msg');
    if(msg) msg.innerHTML=`<div class="msg ok">${STATE.lang==='ar'?'تمت إضافة الاختيار للسلة ✅':'Ajouté au panier ✅'}</div>`;
  };
  root.querySelectorAll('[data-purchase-add]').forEach(btn=>{
    btn.onclick=(e)=>{e.preventDefault(); addItem(btn.dataset.purchaseAdd);};
  });
  const isPreview = !!(root.closest && root.closest('#preview-overlay'));
  const getItems=()=> isPreview ? (PREVIEW_CART_ITEM ? [PREVIEW_CART_ITEM] : []) : STATE.cartItems;
  const getLang=()=> isPreview ? PREVIEW_LANG : STATE.lang;
  const refreshCart=(open)=>{
    const items=getItems();
    const lang=getLang();
    const count=root.querySelector('#cart-count'); if(count) count.textContent=String(items.reduce((n,x)=>n+Math.max(1,Number(x.quantity||1)),0));
    const summary=root.querySelector('#cart-summary');
    if(!summary) return;
    summary.innerHTML=renderFullCartSummaryHtml(items,lang);
    if(open!==undefined) summary.style.display = open ? 'block' : 'none';
  };
  if(basket){
    basket.onclick=()=>{
      const summary=root.querySelector('#cart-summary');
      if(!summary) return;
      const isOpen = summary.style.display==='block';
      if(isOpen){ summary.style.display='none'; return; }
      refreshCart(true);
    };
  }
  const summaryEl=root.querySelector('#cart-summary');
  if(summaryEl){
    summaryEl.onclick=(e)=>{
      const closeBtn=e.target.closest('[data-cart-close]');
      if(closeBtn){ summaryEl.style.display='none'; return; }
      const removeBtn=e.target.closest('[data-cart-remove]');
      const incBtn=e.target.closest('[data-cart-inc]');
      const decBtn=e.target.closest('[data-cart-dec]');
      if(!removeBtn && !incBtn && !decBtn) return;
      const items=getItems();
      if(removeBtn){
        const idx=Number(removeBtn.dataset.cartRemove);
        items.splice(idx,1);
      } else if(incBtn){
        const idx=Number(incBtn.dataset.cartInc);
        if(items[idx]) items[idx].quantity=Math.max(1,Number(items[idx].quantity||1))+1;
      } else if(decBtn){
        const idx=Number(decBtn.dataset.cartDec);
        if(items[idx]) items[idx].quantity=Math.max(1,Number(items[idx].quantity||1)-1);
      }
      if(!isPreview) syncCartItem(); else PREVIEW_CART_ITEM = items.length ? items[items.length-1] : null;
      refreshCart(true);
    };
  }
}

        if(savedSize){
          const esc=CSS.escape(savedSize);
          const el=restored.querySelector(`#product-sizes .choice-btn[data-value="${esc}"], #pack-standard-common-size .choice-btn[data-value="${esc}"], #pack-custom-common-size .choice-btn[data-value="${esc}"]`);
          if(el) el.click();
        }
        if(savedColor){
          const el=restored.querySelector(`#product-colors .choice-btn[data-value="${CSS.escape(savedColor)}"]`);
          if(el) el.click();
        }
        savedPackColors.forEach((color,i)=>{
          if(!color) return;
          const el=restored.querySelector(`.pack-colors[data-piece="${i}"] .choice-btn[data-value="${CSS.escape(color)}"]`);
          if(el) el.click();
        });
        if(savedCart.length){
          STATE.cartItems=savedCart; syncCartItem();
          const count=restored.querySelector('#cart-count'); if(count) count.textContent=String(cartQuantity());
          const summary=restored.querySelector('#cart-summary');
          if(summary){ summary.innerHTML=renderFullCartSummaryHtml(savedCart,STATE.lang); summary.style.display='block'; }
        }
      };
    });
    document.getElementById("submit-btn").onclick = onSubmitOrder;
    // Each init below is independent (video / gallery / clothing options / quantity / purchase
    // selector / cart). Wrapped individually so a failure in one (e.g. video autoplay, a malformed
    // gallery image) can never silently prevent the purchase panel or cart from working.
    const safeInit=(fn,label)=>{ try{ fn(document); }catch(e){ console.error(`renderLanding: ${label} failed:`, e); } };
    safeInit(initProductVideo,"initProductVideo");
    safeInit(initCustomerGallery,"initCustomerGallery");
    safeInit(initClothingOptions,"initClothingOptions");
    safeInit(initSingleQuantity,"initSingleQuantity");
    safeInit(initPurchaseSelector,"initPurchaseSelector");
    safeInit(initCart,"initCart");
  }

  maybeShowAdminReturn(SHOW_ADMIN_RETURN);
}

async function onSubmitOrder(){
  const t=T[STATE.lang],name=document.getElementById("f_name").value.trim(),phone=document.getElementById("f_phone").value.trim(),city=document.getElementById("f_city").value.trim(),address=document.getElementById("f_address").value.trim(),msgBox=document.getElementById("order-msg");
  if(!name||!phone){msgBox.innerHTML=`<div class="msg err">${t.required}</div>`;return;}
  if(!STATE.cartItems.length){
    msgBox.innerHTML=`<div class="msg err">${STATE.lang==='ar'?'اختار المنتج وضيفو للسلة من فضلك':'Veuillez ajouter votre choix au panier'}</div>`;
    return;
  }
  for(const item of STATE.cartItems){
    const selected=item.purchaseType;
    if(selected==='product'&&STATE.product.product_type==='clothing'&&(!item.productOptions?.size||!item.productOptions?.color)){msgBox.innerHTML=`<div class="msg err">${STATE.lang==='ar'?'اختار المقاس واللون من فضلك':'Veuillez choisir la taille et la couleur'}</div>`;return;}
    if((selected==='pack_standard'||selected==='pack_custom')&&csvList(STATE.product.sizes).length&&(item.packOptions||[]).some(x=>!x.size)){msgBox.innerHTML=`<div class="msg err">${STATE.lang==='ar'?'اختار المقاس من فضلك':'Veuillez choisir la taille'}</div>`;return;}
    if(selected==='pack_custom'&&(item.packOptions||[]).some(x=>!x.color)){msgBox.innerHTML=`<div class="msg err">${STATE.lang==='ar'?'اختار لون كل قطعة من فضلك':'Veuillez choisir la couleur de chaque pièce'}</div>`;return;}
  }
  const first=STATE.cartItems[0];
  STATE.purchaseType=first.purchaseType;
  STATE.order={customer_name:name,phone,city,address,quantity:cartQuantity(),product_options:{cart_items:STATE.cartItems},pack_options:[],cart_items:STATE.cartItems};
  if(STATE.upsell) renderUpsellStep(); else await finalizeOrder(false,null);
}

  const t = T[STATE.lang];
  const up = STATE.upsell;
  const upTitle = STATE.lang==="ar" ? up.title_ar : up.title_fr;
  const app = document.getElementById("app");

async function finalizeOrder(upsellAccepted, upsellId){
  const t = T[STATE.lang];
  const body = {
    product_id: STATE.product.id,
    customer_name: STATE.order.customer_name,
    phone: STATE.order.phone,
    address: STATE.order.address,
    city: STATE.order.city,
    quantity: STATE.order.quantity,
    pack_selected: STATE.cartItems.some(x=>x.purchaseType!=='product'),
    pack_price: STATE.cartItems.filter(x=>x.purchaseType!=='product').reduce((sum,x)=>sum+Number(x.unitPrice||0)*Math.max(1,Number(x.quantity||1)),0) || null,
    pack_title: STATE.cartItems.length>1 ? (STATE.lang === "ar" ? "طلب متعدد" : "Commande multiple") : (STATE.purchaseType === "pack_standard" ? "Pack Standard" : STATE.purchaseType === "pack_custom" ? (STATE.lang === "ar" ? "Pack مخصص" : "Pack personnalisé") : null),
    pack_options: STATE.cartItems.length===1 && STATE.cartItems[0].purchaseType!=='product' ? (STATE.cartItems[0].packOptions||[]) : [],
    product_options: { cart_items: STATE.cartItems },
    upsell_accepted: upsellAccepted,
    upsell_id: upsellId
  };
  const msgBox = document.getElementById("order-msg");
  const finishBtn = document.getElementById("finish-btn") || document.getElementById("submit-btn");
  if(finishBtn) finishBtn.disabled = true;

  // Customer orders are inserted anonymously. We only need Supabase to confirm
  // the INSERT succeeded; requesting the inserted row back would unnecessarily
  // require SELECT visibility on the orders table.
  const res = await sbInsertPublicOrder(body);
  const insertedOk = res.ok && res.status >= 200 && res.status < 300;

  if(!insertedOk){
    console.error("Order insert failed:", res.status, res.data);
  }

  if(insertedOk){
    STATE.cartItems = [];
    syncCartItem();
    STATE.step = "success";
    renderLanding();
  } else {
    if(finishBtn) finishBtn.disabled = false;
    if(msgBox) msgBox.innerHTML = `<div class="msg err">${t.order_error}</div>`;
  }
}

async function loadAdminData(){
  adminData = { settings:null, product:null, products:[], upsell:null, orders:[] };

  const safe = async (fn, fallback) => {
    try { return await fn(); }
    catch(e) { console.error("Admin data request failed:", e); return fallback; }
  };

  const [s,plist,o] = await Promise.all([
    safe(()=>sbGet("settings","id=eq.1&select=*"), []),
    safe(()=>sbGet("products","select=*&order=created_at.asc"), []),
    safe(()=>sbGetAuth("orders","select=*&order=created_at.desc&limit=100"), [])
  ]);

  adminData.settings = Array.isArray(s) ? (s[0] || null) : null;
  adminData.products = Array.isArray(plist) ? plist : [];
  const keepId = adminData.product?.id;
  adminData.product = (keepId && adminData.products.find(x=>x.id===keepId)) || adminData.products[0] || null;
  adminData.orders = Array.isArray(o) ? o : [];

  if(adminData.product){
    const u = await safe(()=>sbGet("upsells", `product_id=eq.${adminData.product.id}&select=*&limit=1`), []);
    adminData.upsell = Array.isArray(u) ? (u[0] || null) : null;
  }
  return true;
}

/* Columns that exist on the settings table from day one. Anything else (font_style, primary_color, ...)
   only saves once the admin has run the ALTER TABLE statements for the Design tab (see project notes). */
const SAFE_SETTINGS_FIELDS = ["store_name","theme_id","bg_color","default_language","whatsapp_enabled","whatsapp_number","whatsapp_timing"];
async function saveSettingsSmart(body){
  let res = await sbUpdate("settings","id=eq.1", body);
  let success = res.ok && res.status>=200 && res.status<300 && Array.isArray(res.data) && res.data.length>0;
  if(success) return { success:true, fallback:false };
  const safeBody = {};
  SAFE_SETTINGS_FIELDS.forEach(k=>{ if(k in body) safeBody[k]=body[k]; });
  if(Object.keys(safeBody).length === Object.keys(body).length){
    return { success:false, fallback:false };
  }
  res = await sbUpdate("settings","id=eq.1", safeBody);
  success = res.ok && res.status>=200 && res.status<300 && Array.isArray(res.data) && res.data.length>0;
  return { success, fallback:true };
}

async function selectProductForEdit(id){

async function toggleProductActive(id, checked){
  const res=await sbUpdate('products',`id=eq.${id}`,{is_active:checked});
  if(res.ok){
    const item=(adminData.products||[]).find(x=>String(x.id)===String(id));
    if(item) item.is_active=checked;
    if(adminData.product && String(adminData.product.id)===String(id)) adminData.product.is_active=checked;
    const activeCb=document.getElementById('p_active');
    if(activeCb && adminData.product && String(adminData.product.id)===String(id)) activeCb.checked=checked;
  }else{
    document.getElementById('save-msg').innerHTML='<div class="msg err">تعذر تبديل الحالة، حاول مرة أخرى</div>';
    renderProductTab();
  }

function collectPackBody(){
  const type=document.getElementById('p_type')?.value||'standard';
  if(type!=='clothing') return {pack_config:{single:{enabled:true,visible:true}}};
  const stdColors=Array.from(document.querySelectorAll('#std-colors .std-color')).map(s=>s.value||'');
  const std={
    enabled:!!document.getElementById('std_enabled')?.checked,
    visible:!!document.getElementById('std_visible')?.checked,
    pieces:Math.max(1,parseInt(document.getElementById('std_pieces')?.value||'3',10)),
    price:document.getElementById('std_price')?.value?parseFloat(document.getElementById('std_price').value):null,
    old_price:document.getElementById('std_old_price')?.value?parseFloat(document.getElementById('std_old_price').value):null,
    colors:stdColors
  };
  const cus={
    enabled:!!document.getElementById('cus_enabled')?.checked,
    visible:!!document.getElementById('cus_visible')?.checked,
    pieces:Math.max(1,parseInt(document.getElementById('cus_pieces')?.value||'3',10)),
    price:document.getElementById('cus_price')?.value?parseFloat(document.getElementById('cus_price').value):null,
    old_price:document.getElementById('cus_old_price')?.value?parseFloat(document.getElementById('cus_old_price').value):null
  };

async function saveProduct(){
  if(!PREVIEW_APPROVED){document.getElementById('save-msg').innerHTML='<div class="msg err">خاصك تدير المعاينة قبل الحفظ</div>';return;}
  const type=document.getElementById('p_type').value;
  const baseBody={title_ar:document.getElementById('p_title_ar').value,title_fr:document.getElementById('p_title_fr').value,description_ar:document.getElementById('p_desc_ar').value,description_fr:document.getElementById('p_desc_fr').value,price:parseFloat(getProductFormValue('price'))||0,old_price:getProductFormValue('old_price')?parseFloat(getProductFormValue('old_price')):null,video_url:pendingVideoUrl||'',images:pendingImages.slice(),is_active:document.getElementById('p_active').checked,product_type:type,sizes:document.getElementById('p_sizes')?.value||'',colors:document.getElementById('p_colors')?.value||''};
  const body={...baseBody,...collectPackBody()};
  const msg=document.getElementById('save-msg'),btn=document.getElementById('save-product');btn.disabled=true;
  try{
    let res=adminData.product?await sbUpdate('products',`id=eq.${adminData.product.id}`,body):await sbInsert('products',body,true);
    let ok=res.ok&&res.status>=200&&res.status<300&&(!adminData.product?Array.isArray(res.data)&&res.data.length>0:true);
    if(!ok && adminData.product){
      const fallback=await sbUpdate('products',`id=eq.${adminData.product.id}`,baseBody);
      ok=fallback.ok&&fallback.status>=200&&fallback.status<300;
      if(ok){
        msg.innerHTML='<div class="msg ok">تم الحفظ ✅</div>';
        UNSAVED_DRAFT.product=null;PREVIEW_APPROVED=false;await loadAdminData();renderProductTab();btn.disabled=false;return;
      }
      res=fallback;
    }
    if(ok){
      // A fresh insert doesn't have adminData.product set yet - point it at the row we just
      // created so loadAdminData (which re-selects by id) lands back on the new product
      // instead of falling back to whichever product happens to be oldest.
      if(!adminData.product && Array.isArray(res.data) && res.data[0]) adminData.product = res.data[0];
      msg.innerHTML='<div class="msg ok">تم الحفظ ✅</div>';
      UNSAVED_DRAFT.product=null;PREVIEW_APPROVED=false;await loadAdminData();renderProductTab();
    }else{
      const detail=res.data?.message||res.data?.hint||res.data?.details||res.error||`HTTP ${res.status}`;
      msg.innerHTML=`<div class="msg err">وقع مشكل فالحفظ: ${escHtml(detail)}</div>`;
    }
  }catch(e){msg.innerHTML=`<div class="msg err">وقع مشكل: ${escHtml(e?.message||'خطأ غير معروف')}</div>`}
  btn.disabled=false;
}

  const msg=document.getElementById('save-msg'),btn=document.getElementById('delete-product');if(btn)btn.disabled=true;

}

async function onPackImagesSelected(e){

function renderImagesPreview(){
  const box = document.getElementById("images-preview");
  if(!box) return;
  box.innerHTML = pendingImages.map((url,idx)=>`
    <div class="img-thumb">
      <img src="${url}">
      <button type="button" class="rm-btn" data-idx="${idx}">✕</button>
      <div class="mv-btns">
        ${idx>0 ? `<button type="button" data-mv="${idx}:-1">◀</button>` : ""}
        ${idx<pendingImages.length-1 ? `<button type="button" data-mv="${idx}:1">▶</button>` : ""}
      </div>
    </div>
  `).join("");
  box.querySelectorAll(".rm-btn").forEach(b=>{
    b.onclick = ()=>{ pendingImages.splice(parseInt(b.dataset.idx,10),1); renderImagesPreview(); };
  });
  box.querySelectorAll("[data-mv]").forEach(b=>{
    b.onclick = ()=>{
      const parts = b.dataset.mv.split(":").map(Number);
      const idx = parts[0], dir = parts[1];
      const newIdx = idx+dir;
      if(newIdx<0 || newIdx>=pendingImages.length) return;
      const tmp = pendingImages[idx];
      pendingImages[idx] = pendingImages[newIdx];
      pendingImages[newIdx] = tmp;
      renderImagesPreview();
    };
  });
}

async function onImagesSelected(e){
  const files = Array.from(e.target.files||[]);
  e.target.value = "";
  if(files.length===0) return;
  const status = document.getElementById("images-status");
  for(const file of files){
    if(!file.type.startsWith("image/")){
      status.innerHTML = `<span style="color:#B02A2A">الملف "${file.name}" ماشي صورة</span>`;
      continue;
    }
    if(file.size > MAX_IMAGE_MB*1024*1024){
      status.innerHTML = `<span style="color:#B02A2A">الصورة "${file.name}" كبيرة بزاف (الحد الأقصى ${MAX_IMAGE_MB}MB)</span>`;
      continue;
    }
    status.textContent = `جاري رفع ${file.name}...`;
    const res = await sbUploadFile(file, "images");
    if(res.ok){
      pendingImages.push(res.url);
      renderImagesPreview();
      status.textContent = "";
    } else {
      status.innerHTML = `<span style="color:#B02A2A">فشل رفع "${file.name}": ${res.error}</span>`;
    }
  }
}

      image_url: pendingUpsellImage||"",
      is_active: document.getElementById("u_active").checked
    };
    // video_url only exists once the SQL migration for it has been run - try with it first,

    const bodyWithVideo = { ...baseBody, video_url: pendingUpsellVideo||"" };

function openChangePasswordModal(){
  const old = document.getElementById("change-pass-modal");
  if(old) old.remove();
  const overlay = document.createElement("div");
  overlay.id = "change-pass-modal";
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <button type="button" class="close-x" id="cp-close">✕</button>

      <div class="field"><label>كلمة السر الجديدة</label><input id="cp_new" type="password"></div>
      <div class="field"><label>تأكيد كلمة السر الجديدة</label><input id="cp_confirm" type="password"></div>
      <div id="cp-msg"></div>
      <button class="cta" id="cp-save-btn" type="button">حفظ</button>
    </div>
  `;
  document.body.appendChild(overlay);
  translateAdminDom(overlay);
  document.getElementById("cp-close").onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.getElementById("cp-save-btn").onclick = async ()=>{
    const oldPass = document.getElementById("cp_old").value;
    const p1 = document.getElementById("cp_new").value;
    const p2 = document.getElementById("cp_confirm").value;
    const msg = document.getElementById("cp-msg");
    const email = session.user && session.user.email;
    if(!email){ msg.innerHTML = `<div class="msg err">وقع مشكل بالجلسة، عاود دخول من جديد</div>`; return; }
    if(!oldPass){ msg.innerHTML = `<div class="msg err">دخل كلمة السر القديمة</div>`; return; }
    if(!p1 || p1.length<6){ msg.innerHTML = `<div class="msg err">كلمة السر الجديدة خاصها 6 حروف/أرقام على الأقل</div>`; return; }
    if(p1 !== p2){ msg.innerHTML = `<div class="msg err">كلمتا السر الجديدة غير متطابقتين</div>`; return; }
    const btn = document.getElementById("cp-save-btn");
    btn.disabled = true;
    msg.innerHTML = `<div class="small-muted">جاري التحقق...</div>`;
    const verify = await sbLogin(email, oldPass);
    if(!verify.access_token){
      msg.innerHTML = `<div class="msg err">كلمة السر القديمة غير صحيحة</div>`;
      btn.disabled = false;
      return;
    }
    const res = await sbUpdateUserPassword(verify.access_token, p1);
    if(res.ok){
      msg.innerHTML = `<div class="msg ok">Password changed successfully ✅</div>`;
      saveSession({
        access_token: verify.access_token,
        refresh_token: verify.refresh_token,
        expires_at: Date.now() + (verify.expires_in||3600)*1000,
        user: verify.user
      });
      setTimeout(()=> overlay.remove(), 1400);
    } else {
      msg.innerHTML = `<div class="msg err">وقع مشكل، حاول مرة أخرى</div>`;
      btn.disabled = false;
    }
  };
}

    UNSAVED_DRAFT.settings=Object.assign({},s);
  }
  if(document.getElementById("d_bg_style")){
    Object.assign(s, readDesignFields());
    UNSAVED_DRAFT.settings=Object.assign({},s);
  }
  const p=Object.assign({},adminData.product||{},UNSAVED_DRAFT.product||{});
  if(document.getElementById("p_title_ar")){
    p.title_ar=document.getElementById("p_title_ar").value; p.title_fr=document.getElementById("p_title_fr").value;

    p.price=parseFloat(getProductFormValue("price"))||0;
    const oldP=getProductFormValue("old_price"); p.old_price=oldP?parseFloat(oldP):null;

  return {settings:s,product:p};
}

  PREVIEW_SNAPSHOT = {
    settings: JSON.parse(JSON.stringify(settings || {})),
    product: JSON.parse(JSON.stringify(product || {}))
  };
  PREVIEW_LANG = settings.default_language || "ar";
  renderPreviewOverlay(PREVIEW_SNAPSHOT.settings, PREVIEW_SNAPSHOT.product);
  setPreviewApproval(true);
}

function renderPreviewOverlay(settings, product, preservePurchaseType){
  let overlay = document.getElementById("preview-overlay");
  const previousPreviewCart = PREVIEW_CART_ITEM;
  if(!overlay){
    overlay = document.createElement("div");
    overlay.id = "preview-overlay";
    overlay.className = "preview-overlay";
    document.body.appendChild(overlay);
  }
  applyThemeAndContrast(settings);
  document.documentElement.dir = PREVIEW_LANG === "ar" ? "rtl" : "ltr";

  const hasProduct = product && (product.title_ar || product.title_fr);
  const t = T[PREVIEW_LANG] || T.ar;
  const bodyHtml = hasProduct
    ? buildFormMarkup(settings, product, PREVIEW_LANG, {product:1, pack_standard:1, pack_custom:1}, "preview-storefront")
    : `<div class="wrap" style="padding-top:80px; text-align:center; color:var(--muted)">${t.no_product}</div>`;

  overlay.innerHTML = `
    <div class="preview-bar">
      <span class="tag">👁 معاينة (غير محفوظ)</span>
      <button type="button" id="close-preview">🔙 رجوع للتعديل</button>
    </div>
    ${bodyHtml}
  `;
  document.getElementById("close-preview").onclick = closePreview;

  if(hasProduct){
    overlay.__previewProduct = product;
    const safeInit=(fn,label)=>{ try{ fn(overlay); }catch(e){ console.error(`renderPreviewOverlay: ${label} failed:`, e); } };
    safeInit(initProductVideo,"initProductVideo");
    safeInit(initCustomerGallery,"initCustomerGallery");
    safeInit(initSingleQuantity,"initSingleQuantity");
    safeInit(initClothingOptions,"initClothingOptions");
    safeInit(initPurchaseSelector,"initPurchaseSelector");
    if(preservePurchaseType){ const r=overlay.querySelector(`input[name="purchase-choice"][value="${preservePurchaseType}"]`); if(r){ r.checked=true; r.dispatchEvent(new Event('change',{bubbles:true})); } }
    PREVIEW_CART_ITEM = previousPreviewCart ? JSON.parse(JSON.stringify(previousPreviewCart)) : null;
    const realCartItem = STATE.cartItem;
    STATE.cartItem = PREVIEW_CART_ITEM;
    initCart(overlay);
    PREVIEW_CART_ITEM = STATE.cartItem ? JSON.parse(JSON.stringify(STATE.cartItem)) : null;
    STATE.cartItem = realCartItem;
    overlay.querySelectorAll("[data-lang]").forEach(b=>{
      b.onclick = ()=>{ const current=overlay.querySelector('input[name="purchase-choice"]:checked')?.value||''; PREVIEW_LANG = b.dataset.lang; renderPreviewOverlay(settings, product, current); };
    });

    overlay.querySelectorAll("[data-purchase-add]").forEach(btn=>{
      btn.onclick = (e)=>{
        e.preventDefault();
        const savedReal = STATE.cartItem;
        STATE.cartItem = PREVIEW_CART_ITEM;
        const item = getCurrentCartItem(overlay);
        const currentProduct = overlay.__previewProduct || product;
        const lang = PREVIEW_LANG;
        const err=(ar,fr)=>{ const msg=overlay.querySelector("#order-msg"); if(msg) msg.innerHTML=`<div class="msg err">${lang==='ar'?ar:fr}</div>`; };
        if(item.purchaseType==='product' && currentProduct?.product_type==='clothing'){
          const sizes=csvList(currentProduct.sizes||'');
          const colors=csvList(currentProduct.colors||'');
          if(sizes.length && !item.productOptions.size){ err('اختار المقاس من فضلك','Veuillez choisir la taille'); STATE.cartItem=savedReal; return; }
          if(colors.length && !item.productOptions.color){ err('اختار اللون من فضلك','Veuillez choisir la couleur'); STATE.cartItem=savedReal; return; }
        }
        if(item.purchaseType==='pack_standard'){
          const sizes=csvList(currentProduct?.sizes||'');
          if(sizes.length && !(item.packOptions?.[0]?.size)){ err('اختار المقاس من فضلك','Veuillez choisir la taille'); STATE.cartItem=savedReal; return; }
        }
        if(item.purchaseType==='pack_custom'){
          const sizes=csvList(currentProduct?.sizes||'');
          if(sizes.length && !(item.packOptions?.[0]?.size)){ err('اختار المقاس من فضلك','Veuillez choisir la taille'); STATE.cartItem=savedReal; return; }
          if((item.packOptions||[]).some(x=>!x.color)){ err('اختار لون كل قطعة من فضلك','Veuillez choisir la couleur de chaque pièce'); STATE.cartItem=savedReal; return; }
        }
        if(btn.dataset.purchaseAdd && item.purchaseType!==btn.dataset.purchaseAdd){
          const radio=overlay.querySelector(`input[name="purchase-choice"][value="${btn.dataset.purchaseAdd}"]`);
          if(radio){radio.checked=true; radio.dispatchEvent(new Event('change',{bubbles:true}));}
          item.purchaseType=btn.dataset.purchaseAdd;
        }
        if(item.purchaseType!=='product') item.quantity=1;
        PREVIEW_CART_ITEM = JSON.parse(JSON.stringify(item));
        const count=overlay.querySelector("#cart-count"); if(count) count.textContent=String(item.quantity||1);
        const summary=overlay.querySelector("#cart-summary");
        if(summary){summary.innerHTML=renderCartSummaryHtml(item,PREVIEW_LANG);summary.style.display="block";}
        const msg=overlay.querySelector("#order-msg");
        if(msg) msg.innerHTML=`<div class="msg ok">${PREVIEW_LANG==='ar'?'تمت إضافة الاختيار للسلة ✅':'Ajouté au panier ✅'}`;
        STATE.cartItem=savedReal;
      };
    });
    const previewBasket = overlay.querySelector("#cart-button");
    if(previewBasket){
      previewBasket.onclick=()=>{
        const item=PREVIEW_CART_ITEM||getCurrentCartItem(overlay);
        PREVIEW_CART_ITEM=JSON.parse(JSON.stringify(item));
        const count=overlay.querySelector("#cart-count"); if(count) count.textContent=String(item.quantity||1);
        const summary=overlay.querySelector("#cart-summary");
        if(summary){summary.innerHTML=renderCartSummaryHtml(item,PREVIEW_LANG);summary.style.display="block";}
      };
    }

    const submitBtn = overlay.querySelector("#submit-btn");
    if(submitBtn) submitBtn.onclick = (e)=>{
      e.preventDefault();
      const msgBox = overlay.querySelector("#order-msg");
      if(msgBox) msgBox.innerHTML = `<div class="msg ok">هادي معاينة فقط، الطلب ما غاديش يتسجل فقاعدة البيانات</div>`;
    };
  }
}

function closePreview(){
  const overlay = document.getElementById("preview-overlay");
  if(overlay) overlay.remove();
  PREVIEW_CART_ITEM = null;
  resetAdminChrome();
  document.documentElement.dir = "rtl";
}
</script>
</body>
</html>
